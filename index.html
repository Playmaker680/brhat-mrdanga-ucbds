<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d5a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bṛhat Mṛdaṅga">
<title>Bṛhat Mṛdaṅga Database</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one narrow column, one task per screen. Home = two big actions + search; deeper screens behind a back button */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#1c2631; --muted:#5b6674; --line:#dde2e8;
  --blue:#1d5a86; --blue-ink:#ffffff; --blue-soft:#e5eef6;
  --marigold:#b97c06; --marigold-soft:#fbf0d6;
  --alert:#b23a2a; --alert-soft:#fbe8e4; --good:#2e7d4f;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --ink:#e8edf2; --muted:#9ba7b4; --line:#2c3642;
  --blue:#82b8df; --blue-ink:#0d1a26; --blue-soft:#1b3044;
  --marigold:#f0c060; --marigold-soft:#372c12;
  --alert:#f0927f; --alert-soft:#3c221d; --good:#7cc79a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --ink:#e8edf2; --muted:#9ba7b4; --line:#2c3642;
  --blue:#82b8df; --blue-ink:#0d1a26; --blue-soft:#1b3044;
  --marigold:#f0c060; --marigold-soft:#372c12;
  --alert:#f0927f; --alert-soft:#3c221d; --good:#7cc79a; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--blue)}
.gate{min-height:80vh;display:grid;place-items:center;padding-block:40px}
.gate .card{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate .card h1{font-size:1.5rem}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.gbtn svg{width:20px;height:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:980px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:6px}
.bar .title{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;background:none;border:0;padding:0;color:var(--ink);text-align:left;font-family:inherit;cursor:pointer}
.bar .title span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--marigold)}
.gate .logo{width:96px;height:96px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border:0;border-radius:10px;background:var(--blue-soft);color:var(--blue);font:700 .95rem var(--font);cursor:pointer}
.back svg{width:20px;height:20px}
.avatar-sm{width:32px;height:32px;border-radius:50%}
main{padding-block:24px 60px}
h1{font-size:1.75rem;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.35rem;line-height:1.25;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
@media (max-width:480px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;min-height:170px;padding:20px;border-radius:var(--r);border:2px solid var(--line);font:inherit;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .12s,box-shadow .12s}
.tile .go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem;padding:6px 12px;border-radius:99px;color:var(--surface)}
.tile.meet{border-color:var(--blue)} .tile.meet .go{background:var(--blue);color:var(--blue-ink)}
.tile.add{border-color:var(--marigold)} .tile.add .go{background:var(--marigold);color:var(--surface)}
.tile:hover{transform:translateY(-2px);box-shadow:0 4px 0 var(--line)}
.tile svg{width:34px;height:34px}
.tile b{font-size:1.3rem}
.tile span{color:var(--muted);font-size:.95rem}
.tile.meet{background:var(--blue-soft)} .tile.meet svg{color:var(--blue)}
.tile.add{background:var(--marigold-soft)} .tile.add svg{color:var(--marigold)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
label.f small{font-weight:400;color:var(--muted)}
input,select,textarea{font:inherit;font-size:1.02rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:48px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input.big{font-size:1.15rem;min-height:56px;padding:12px 14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;font:700 1rem var(--font);border-radius:10px;padding:10px 18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.block{width:100%}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.btn{text-decoration:none}
.callrow{display:flex;gap:6px;flex-wrap:nowrap}
.link{background:none;border:0;padding:6px 0;font:inherit;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.x{background:none;border:0;min-width:44px;min-height:44px;border-radius:10px;color:var(--muted);cursor:pointer;font:700 1.2rem var(--font)}
.x:hover{background:var(--alert-soft);color:var(--alert)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 0;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.results{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:54px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.res:last-child{border-bottom:0}
.res:hover,.res.hl{background:var(--blue-soft)}
.res .name{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .meta{color:var(--muted);font-size:.88rem;white-space:nowrap}
.res.new{color:var(--blue);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.85rem;background:var(--blue-soft);color:var(--blue);font-weight:700;white-space:nowrap}
.pill.warn{background:var(--alert-soft);color:var(--alert)}
.pill.gold{background:var(--marigold-soft);color:var(--marigold)}
.shortcuts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.shortcuts button{border:0;cursor:pointer;font:700 .9rem var(--font);min-height:40px;padding:6px 14px}
.more{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.more button{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 40px 14px 14px;border:2px solid color-mix(in srgb,var(--blue) 45%,var(--line));border-radius:12px;background:var(--surface);font:inherit;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.more button::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--blue);border-top:2.5px solid var(--blue);transform:translateY(-50%) rotate(45deg)}
.more button b{color:var(--blue)}
.more button b{font-size:1rem} .more button span{font-size:.85rem;color:var(--muted)}
.more button:hover{border-color:var(--blue);background:var(--blue-soft)}
.checked{display:flex;flex-direction:column;margin-top:10px}
.checked div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 4px 2px;border-bottom:1px solid var(--line)}
.checked div:last-child{border-bottom:0}
.checked .name{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec > summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;min-height:60px}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary b{font-size:1.08rem}
details.sec > summary .sum{margin-left:auto;color:var(--muted);font-size:.9rem;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sec > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;flex:none}
details.sec[open] > summary::after{transform:rotate(-135deg);margin-top:4px}
details.sec > .in{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.facts dt{font-size:.85rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.note{border-left:3px solid var(--blue-soft);padding:2px 0 2px 12px}
.note .by{font-size:.9rem;color:var(--muted)} .note .by b{color:var(--ink)}
.note p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:5px;background:var(--line)}
.dots i.on{background:var(--blue)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.82rem;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.88rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--font)}
.banner{padding:12px 16px;border-radius:12px;background:var(--marigold-soft);margin-bottom:18px}
.me-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;margin-bottom:20px}
.me-av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font:700 1.08rem var(--font);color:var(--ink);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--blue)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt .ck{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--blue-ink);font-size:.95rem}
.opt[aria-pressed="true"] .ck{background:var(--blue);border-color:var(--blue)}
.rowlink{flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px}
.modal{max-width:460px;width:100%;max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.checks{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checks legend{font-weight:700;font-size:.95rem;margin-bottom:6px;padding:0}
.checks legend small{font-weight:400;color:var(--muted)}
.chk{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.chk:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.res.check{cursor:pointer;justify-content:flex-start;gap:14px}
.res.check.on{background:var(--blue-soft)}
.bullets{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.bullets li{overflow-wrap:anywhere}
.bullets li > span:first-child{display:block}
.bullets .by{display:block;font-size:.85rem;color:var(--muted)}
.confirm{padding:14px;border-radius:12px;background:var(--alert-soft);display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:22px 4px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap gate" id="gate"><div class="card" id="gateCard"><p class="muted">Loading…</p></div></div>
<header hidden><div class="wrap" id="barWrap"><div class="bar" id="bar"></div></div></header>
<main class="wrap" id="main" hidden></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
// ---------- helpers ----------
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v==null||v===false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if (k==="class") el.className=v;
    else if (k==="value") el.value=v;
    else if (k==="html") el.innerHTML=v; // only used for static icons
    else el.setAttribute(k, v===true?"":v);
  }
  for (const k of kids.flat(Infinity)){ if(k==null||k===false) continue; el.append(k.nodeType?k:String(k)); }
  return el;
}
const ICON = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  meet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.4"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><path d="M15 14.6c2.6-.4 4.8 1 5.5 4"/></svg>',
  add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="3.4"/><path d="M3.5 19.5c.7-3.3 3.3-5.2 6.5-5.2 1.3 0 2.5.3 3.5.9"/><path d="M18 13v7M14.5 16.5h7"/></svg>'
};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parse=s=>{ if(!s) return null; const [y,m,d]=s.slice(0,10).split("-").map(Number); return new Date(y,m-1,d); };
const fmt=s=>{ const d=parse(s); return d?d.toLocaleDateString(undefined,{weekday:"short",month:"long",day:"numeric"}):"—"; };
const fmtShort=s=>{ const d=parse(s); return d?d.toLocaleDateString(undefined,{month:"short",day:"numeric"}):"—"; };
const fmtWhen=s=>s?new Date(s).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const plural=(n,w,p)=>`${n} ${n===1?w:(p||w+"s")}`;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2400); }

const ROLES=["Student","Volunteer","Student Leader","Speaker"];
const SCREENS=["home","meeting","add","people","meetings","insights","team","me","notes","messages","message","member","import","dupes"];
const TEAM_ROLES=["Volunteer","Student Leader","Speaker"];
const initials=n=>(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
function signOutNow(){ if(window.FB&&window.FB.signOut) window.FB.signOut(); else toast("In this preview, sign out from your Claude account. On your live site this signs you out."); }

// ---------- state ----------
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&document.querySelector(".overlay")) e.preventDefault(); },true);
const S={ members:[], messages:[], people:[], meetings:[], progress:[], notes:[], team:[], config:{},
  screen: SCREENS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "home", stack:[],
  personId:null, meetingId:null, editing:false, confirm:null, open:new Set(["notes"]),
  homeQ:"", backingUp:null, merging:null, copyText:null, dupWarn:null, dupOK:null, importText:"", importing:null, assignQ:"", assigning:false, msgId:null, memberId:null, rpName:null, msgQ:"", msgFilter:"all", roleDismissed:false, promptRole:null, fc:undefined, fcFor:null, attQ:"", attHl:0, quickAdd:null, peopleQ:"", filter:"all", addMore:false,
  db:null, user:null, myId:null, meName:"", avatar:"", canWrite:true, ready:false, offline:false, profiles:{}, dirty:new Set() };
document.addEventListener("input",e=>{ if(e.target.id) S.dirty.add(e.target.id); });
document.addEventListener("toggle",e=>{ const d=e.target; if(d.tagName==="DETAILS"&&d.dataset.key){ d.open?S.open.add(d.dataset.key):S.open.delete(d.dataset.key); } },true);
const clearDirty=el=>{ if(el) el.querySelectorAll("[id]").forEach(x=>S.dirty.delete(x.id)); };
function nav(screen, patch){ S.stack.push({screen:S.screen,personId:S.personId,meetingId:S.meetingId}); Object.assign(S,{screen,editing:false,confirm:null,quickAdd:null,attQ:"",dupWarn:null,dupOK:null},patch||{}); S.dirty.clear(); render(); window.scrollTo(0,0); }
function back(){ const p=S.stack.pop()||{screen:"home"}; Object.assign(S,p,{editing:false,confirm:null,quickAdd:null}); S.dirty.clear(); render(); window.scrollTo(0,0); }
function home(){ S.stack=[]; Object.assign(S,{screen:"home",editing:false,confirm:null,quickAdd:null,homeQ:""}); S.dirty.clear(); render(); window.scrollTo(0,0); }

// ---------- names & stats ----------
function memberName(uid){
  if(!uid) return "Someone";
  const t=S.team.find(x=>x.id===uid);
  return (t&&t.name)||S.profiles[uid]||(uid===S.myId?(S.meName||"You"):"A teammate");
}
const personById=id=>S.people.find(p=>p.id===id);
const pendingRoll={};
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"");
const activeTeam=()=>S.team.filter(t=>!t.removed);
const isAdminNow=()=>!window.FB||!!window.FB.isAdmin;
const ten=v=>{ const d=String(v||"").replace(/\D/g,""); return d.length>=10?d.slice(-10):""; };
function callLinks(p){ const d=ten(p.phone); if(!d) return null;
  return h("span",{class:"callrow"},h("a",{class:"btn small",href:"tel:+1"+d,"aria-label":`Call ${p.name}`},"Call"),h("a",{class:"btn small",href:"sms:+1"+d,"aria-label":`Text ${p.name}`},"Text")); }
async function copyNumbers(people){

// ---------- on-demand loading ----------
// Notes and reading/chanting logs are the biggest collections, so they load only for the
// person or teammate on screen. This keeps database reads low as the club grows.
const watches={}, cache={};
function rebuildLazy(){
  const n=new Map(), g=new Map();
  for(const [k,docs] of Object.entries(cache)){ const m=k.startsWith("notes|")?n:g; for(const d of docs) m.set(d.id,d); }
  S.notes=[...n.values()]; S.progress=[...g.values()];
}
function keysFor(){
  if((S.screen==="person"||S.screen==="notes")&&S.personId) return ["notes|personId|"+S.personId,"progress|personId|"+S.personId];
  if(S.screen==="member"&&S.memberId) return ["notes|by|"+S.memberId,"progress|by|"+S.memberId];
  return [];
}
function need(keys){
  if(!S.db) return;
  for(const k of Object.keys(watches)) if(!keys.includes(k)){ try{ watches[k](); }catch(e){} delete watches[k]; delete cache[k]; }
  for(const k of keys){ if(watches[k]) continue;
    const [coll,field,val]=k.split("|");
    watches[k]=S.db.collection(coll).where(field,"==",val).onSnapshot(snap=>{ cache[k]=snap.docs.map(d=>({id:d.id,...d.data()})); rebuildLazy(); render(); },()=>{ cache[k]=cache[k]||[]; render(); }); }
  rebuildLazy();
}
const loaded=()=>keysFor().every(k=>k in cache);

        "Message replies":D.people.slice().sort(byName).map(p=>{ const row={Name:p.name}; let n=0; ws.forEach(w=>{ const y=repl(w).includes(p.id); if(y) n++; row[`${w.date} ${w.title}`.slice(0,60)]=y?"Yes":"No"; }); row["Times replied"]=n; return row; }),
        "Team":D.team.map(t=>({Name:t.name||"",Role:t.title||"",Email:t.email||"","Last signed in":(t.lastSeen||"").slice(0,10),Status:t.removed?"Removed":"Active"})),
        "Access list":D.members.map(m=>({Email:m.id,Role:m.role||"",Admin:m.admin?"Yes":"No"}))
      };
      const wb=X.utils.book_new();
      for(const [name,rows] of Object.entries(sheets)) X.utils.book_append_sheet(wb, rows.length?X.utils.json_to_sheet(rows):X.utils.aoa_to_sheet([["(nothing yet)"]]), name);
      const buf=X.write(wb,{bookType:"xlsx",type:"array"});
      await dl.save({filename:`brhat-mrdanga-full-backup-${stamp8}.xlsx`,data:new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})});
    }
    await write(db=>db.doc("config/app").set({...S.config,lastBackup:{at:new Date().toISOString(),by:S.myId||null,kind}}),"Backup downloaded");
  }catch(e){ if(!(e&&(e.code==="declined"||e.code==="cancelled"))) toast("The backup didn't finish. Check your connection and try again."); }
  S.backingUp=null; render();
}
const backupDue=()=>{ const b=S.config.lastBackup; return !b||!b.at||(Date.now()-new Date(b.at))>30*86400000; };
function backupBox(){
  const b=S.config.lastBackup;
  return h("div",{class:"box stack",style:"gap:10px;border:2px solid "+(backupDue()?"var(--marigold)":"var(--line)")},
    h("h2",{style:"font-size:1.1rem"},"Monthly backup"),
    h("p",{style:"margin:0"},b&&b.at?`Last backup ${ago(b.at)} by ${memberName(b.by)}.`:"No backup yet.",backupDue()?" A backup is due.":""),
    h("p",{class:"muted small",style:"margin:0"},"Downloads every record: people, notes, reading and chanting logs, meetings, attendance, prasadam, message logs, team and the access list. Save the files somewhere safe, like a shared Google Drive folder."),

      h("button",{class:"btn primary",disabled:S.backingUp||null,onclick:()=>backup("xlsx")},S.backingUp==="xlsx"?"Preparing…":"Download everything (Excel)"),
      h("button",{class:"btn",disabled:S.backingUp||null,onclick:()=>backup("json")},S.backingUp==="json"?"Preparing…":"Download everything (JSON)")),
    h("p",{class:"muted small",style:"margin:0"},"Excel is for reading. JSON is the exact copy, which is what you'd use to restore the database if something ever went wrong."));
}

// ---------- Team ----------
function ago(isoStr){ if(!isoStr) return ""; const d=Math.floor((Date.now()-new Date(isoStr))/86400000);
  return d<=0?"today":d===1?"yesterday":d<7?`${d} days ago`:d<60?`${Math.round(d/7)} weeks ago`:fmtShort(isoStr); }
function activityOf(uid){
  const a=[], P=id=>(personById(id)||{}).name||"someone (removed)";
  S.people.forEach(p=>{ if(p.createdBy===uid) a.push({at:p.importedAt||p.createdAt,text:p.importedAt?`Imported ${p.name} from a sign-up sheet`:`Added ${p.name} to the roster`,pid:p.id}); });
  S.notes.forEach(n=>{ if(n.by===uid) a.push({at:n.createdAt,text:`Added a note on ${P(n.personId)}`,pid:n.personId}); });
  S.progress.forEach(x=>{ if(x.by===uid) a.push({at:x.createdAt||x.date,text:`${x.kind==="chanting"||(!x.kind&&x.chanting!=null)?"Updated chanting":"Logged reading"} for ${P(x.personId)}`,pid:x.personId}); });
  S.meetings.forEach(m=>{ if(m.by===uid) a.push({at:m.createdAt||m.date,text:`Started meeting “${m.title||"Club meeting"}”`,mid:m.id});
    if(m.talkBy===uid) a.push({at:m.talkAt,text:`Saved talk and notes for “${m.title||"Club meeting"}”`,mid:m.id});
    prasadamOf(m).forEach(x=>{ if(x.by===uid) a.push({at:x.at,text:`Logged prasadam: ${x.dish}`,mid:m.id}); }); });
  S.messages.forEach(m=>{ if(m.by===uid) a.push({at:m.createdAt||m.date,text:`Created message week “${m.title}”`,msg:m.id}); });
  return a.filter(x=>x.at).sort((x,y)=>x.at<y.at?1:-1);
}
const lastActive=t=>t.lastSeen||null;
function vMember(){
  const t=S.team.find(x=>x.id===S.memberId);

  const counts=[["notes added",S.notes.filter(n=>n.by===t.id).length],["people added",S.people.filter(p=>p.createdBy===t.id).length],["reading and chanting logs",S.progress.filter(x=>x.by===t.id).length],["meetings started",S.meetings.filter(m=>m.by===t.id).length]];

    h("div",{class:"stats"},counts.map(([l,n])=>stat(n,l))),
    h("div",{class:"stack",style:"gap:8px"},h("h2",{style:"font-size:1.1rem"},`Looks after · ${people.length}`),
      people.length?h("div",{class:"list"},people.map(p=>{ const s=stats(p); return h("button",{class:"res",onclick:()=>nav("person",{personId:p.id})},
        h("span",{style:"min-width:0"},h("span",{class:"name",style:"display:block"},p.name),h("span",{class:"meta"},[p.role||"Student",s.last?"came "+fmtShort(s.last):"not at a meeting yet"].join(" · "))),
        s.followUp?blooperPill(s):h("span",{class:"meta"},"View →")); }))
        :h("p",{class:"muted",style:"margin:0"},"No one assigned yet.")),
    h("div",{class:"stack",style:"gap:8px"},h("h2",{style:"font-size:1.1rem"},"Recent activity"),
      !loaded()?h("p",{class:"muted",style:"margin:0"},"Loading activity…"):act.length?h("div",{class:"list"},act.slice(0,12).map(x=>h("button",{class:"res",onclick:()=>x.pid&&personById(x.pid)?nav("person",{personId:x.pid}):x.mid?nav("meeting",{meetingId:x.mid}):x.msg?nav("message",{msgId:x.msg,msgQ:"",msgFilter:"all"}):null},
        h("span",{style:"min-width:0"},h("span",{class:"name",style:"display:block;font-weight:400"},x.text)),h("span",{class:"meta"},fmtWhen(x.at)))))
        :h("p",{class:"muted",style:"margin:0"},"Nothing logged yet.")),
    isAdmin&&t.id!==S.myId?(S.confirm==="rm:"+t.id?h("div",{class:"confirm"},
      h("span",null,`Remove ${name} from the team? ${t.email?"Their sign-in access is removed too. ":""}Their past notes and logs stay.`),
      h("div",{class:"row"},h("button",{class:"btn danger",onclick:async()=>{ const ok=await write(async db=>{ if(t.email) await db.doc("members/"+t.email).delete(); await db.doc("team/"+t.id).update({removed:true}); },"Removed from the team"); if(ok) back(); }},"Remove"),
        h("button",{class:"btn",onclick:()=>{S.confirm=null; render();}},"Keep")))
      :h("button",{class:"link small",style:"color:var(--alert);align-self:flex-start",onclick:()=>{S.confirm="rm:"+t.id; render();}},"Remove from the team")):null);
}
function vTeam(){
  const team=activeTeam().sort((a,b)=>memberName(a.id).localeCompare(memberName(b.id)));
  const meDoc=S.team.find(t=>t.id===S.myId);
  const meForm=meDoc&&S.canWrite?h("form",{class:"box stack",onsubmit:async e=>{

    h("button",{class:"btn",type:"submit",style:"align-self:flex-start"},"Save")); }
  return h("div",{class:"stack",style:"gap:22px"},
    h("div",null,h("h1",null,"Our team and activity"),h("p",{class:"lead"},"Tap anyone to see who they look after and what they've been doing.")),
    team.length?h("div",{class:"list"},team.map(t=>{ const c=S.people.filter(p=>contactsOf(p).includes(t.id)).length, last=lastActive(t);
      return h("button",{class:"res",onclick:()=>nav("member",{memberId:t.id})},
        h("span",{style:"min-width:0"},h("span",{class:"name",style:"display:block"},memberName(t.id)+(t.id===S.myId?" (you)":"")),
          h("span",{class:"meta"},[t.title||"No role yet",`looks after ${plural(c,"person","people")}`,last?"signed in "+ago(last):null].filter(Boolean).join(" · "))),
        h("span",{class:"meta",style:"color:var(--blue);font-weight:700"},"View →")); }))
      :h("div",{class:"empty"},"No one has joined yet."),
    S.myId?h("button",{class:"btn",style:"align-self:flex-start",onclick:()=>nav("me",{meRole:undefined})},"Edit my profile"):null, clubForm,
    accessBox(),
    h("div",{class:"box row",style:"justify-content:space-between"},
      h("span",{class:"muted small"},"Signed in as ",h("b",{style:"color:var(--ink)"},(window.FB&&window.FB.email)||"")),
      h("button",{class:"btn small",onclick:signOutNow},"Sign out")));
}
function accessBox(){

  if(!FB.isAdmin) return h("div",{class:"box"},h("h2",{style:"font-size:1.1rem"},"Adding a teammate"),
    h("p",{style:"margin:8px 0 0"},"Ask an admin to add the person's Google email under Our Team. Once added, they sign in with Google and appear on this page."));
