<style>
/* Layout: one narrow column, one task per screen. Home = two big actions + search; deeper screens behind a back button */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

.msgfold .tx b{color:var(--ink)}
.bell{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.bell svg{width:22px;height:22px}
.bell .dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--alert);color:#fff;font:700 .72rem var(--font);display:grid;place-items:center}
.avbtn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 3px;cursor:pointer;font:700 .9rem var(--font);color:var(--ink);min-height:44px}
.avbtn img,.avbtn .ini{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:.8rem}

.bar>*{flex:none}.bar>.title-wrap{flex:1}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column}

.menu .rowflex{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.menu .sep{border-top:1px solid var(--line);border-radius:0 0 10px 10px;margin-top:4px;color:var(--blue)}
@media (max-width:560px){.menu,.menu.left{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 58px);width:auto;max-height:calc(100dvh - 160px);overflow-y:auto}}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}

.menu button:hover{background:var(--blue-soft)}
.greet{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.greet .date{color:var(--muted);font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}

.card-h h2{font-size:1.1rem}
.section{margin-top:18px}

.arow:last-child{border-bottom:0}
.arow:hover{background:var(--blue-soft)}
.arow .ic{width:10px;height:10px;border-radius:50%;flex:none;background:var(--blue)}
.arow .ic.warn{background:var(--alert)} .arow .ic.gold{background:var(--marigold)}
.arow .t{flex:1;min-width:0}
.arow .n{font-weight:700;font-variant-numeric:tabular-nums}
.arow::after{content:"";width:8px;height:8px;border-right:2.5px solid var(--muted);border-top:2.5px solid var(--muted);transform:rotate(45deg);flex:none}
.snap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.snap div{background:var(--bg);border-radius:12px;padding:12px}
.snap b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.snap span{font-size:.82rem;color:var(--muted)}
@media (max-width:420px){.snap{grid-template-columns:1fr 1fr}.snap div:last-child{grid-column:1/-1}}
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.bcol{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;min-width:0}
.bhead{display:flex;flex-direction:column;gap:6px;padding:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.bhead .btn{align-self:flex-start}
.bbody{max-height:62vh;overflow-y:auto}
.bitem{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bitem:last-child{border-bottom:0}
.bitem .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));scrollbar-width:none;scroll-padding-inline:16px}
.card .chips{margin:0;padding:2px 0 6px}
.chips::-webkit-scrollbar{display:none}
.chipsel{flex:none;width:auto;min-height:42px;border:2px solid var(--line);border-radius:99px;padding:4px 30px 4px 14px;font:700 .9rem var(--font);background-color:var(--surface)}
.chipsel.on{border-color:var(--blue);color:var(--blue)}
.week-edit{padding:0 8px}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font:700 .9rem var(--font);color:var(--ink);cursor:pointer;min-height:42px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.chip .c{font-weight:400;margin-left:4px;opacity:.8}
.mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.mrow:last-child{border-bottom:0}
.mrow.on{background:var(--blue-soft)}
.mrow label{display:flex;align-items:center;gap:12px;flex:1;min-width:170px;cursor:pointer;min-height:44px}
.mrow input[type=checkbox]{width:26px;height:26px;flex:none}
.msgtext{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px 14px;margin:0}

.nextup .callrow .btn{flex:1}

h1{font-size:1.75rem;line-height:1.2;margin:0;text-wrap:balance;overflow-wrap:anywhere}

.h2s{font-size:1.02rem;color:var(--muted)}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden}

.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}

input,select,textarea{font:inherit;font-size:1.02rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:48px}

.checked .name{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

details.sec > summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 4px 0 0;flex:none}
details.sec[open] > summary::after{transform:rotate(-135deg);margin-top:4px}
details.sec > .in{padding:0 18px 18px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.facts dt{font-size:.85rem;color:var(--muted)}
.facts dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.note{border-left:3px solid var(--blue-soft);padding:2px 0 2px 12px}
.note .by{font-size:.9rem;color:var(--muted)} .note .by b{color:var(--ink)}
.note p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:5px;background:var(--line)}
.dots i.on{background:var(--blue)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:.82rem;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.88rem;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--font)}
.guestbar{background:#2b2118;color:#fff;font-size:.9rem}
.guestbar .in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.guestbar .t{flex:1;min-width:0;line-height:1.3}
.guestbar .t b{display:block;letter-spacing:.02em}
.guestbar .t span{opacity:.8;font-size:.82rem}
.guestbar button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.gtag{display:inline-block;background:#e9b44c;color:#2b2118;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:.75rem;font-weight:800;letter-spacing:.06em;vertical-align:1px}
body.guest #main,body.guest header{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.guest #main [style*="user-select"]{-webkit-user-select:none!important;user-select:none!important}
body.guest input,body.guest textarea{-webkit-user-select:text;user-select:text}
@media print{body.guest header,body.guest #main{display:none!important}body.guest::before{content:"Printing is turned off in guest view.";display:block;padding:40px;font:16px sans-serif}}
.banner{padding:12px 16px;border-radius:12px;background:var(--marigold-soft);margin-bottom:18px}
.me-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;margin-bottom:20px}
.me-av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font:700 1.08rem var(--font);color:var(--ink);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--blue)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.opt .ck{margin-left:auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--blue-ink);font-size:.95rem}
.opt[aria-pressed="true"] .ck{background:var(--blue);border-color:var(--blue)}
.rowlink{flex:1;min-width:0;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,16,24,.55);display:grid;place-items:center;padding:16px}
.modal{max-width:460px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.checks{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checks legend{font-weight:700;font-size:.95rem;margin-bottom:6px;padding:0}
.checks legend small{font-weight:400;color:var(--muted)}
.chk{display:flex;align-items:center;gap:12px;min-height:50px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.chk:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.res.check{cursor:pointer;justify-content:flex-start;gap:14px}
.res.check.on{background:var(--blue-soft)}
.bullets{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.bullets li{overflow-wrap:anywhere}
.bullets li > span:first-child{display:block}
.bullets .by{display:block;font-size:.85rem;color:var(--muted)}
.confirm{padding:14px;border-radius:12px;background:var(--alert-soft);display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));text-align:center;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:22px 4px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

// Notes and reading/chanting logs are the biggest collections, so they load only for the

const watches={}, cache={};
function rebuildLazy(){

  for(const [k,docs] of Object.entries(cache)){ const path=k.split("|")[0];
    const m=path.endsWith("/notes")?n:path.endsWith("/progress")?g:path.endsWith("/staff")?staff:path.endsWith("/blocked")?blocked:null;
    if(m) for(const d of docs) m.set(d.id,d); }

function keysFor(){

function need(keys){

  for(const k of Object.keys(watches)) if(!keys.includes(k)){ try{ watches[k](); }catch(e){} delete watches[k]; delete cache[k]; }
  for(const k of keys){ if(watches[k]) continue;

function accessBox(){
  const FB=window.FB||{};
  if(S.guest) return null;
  if(!isAdminNow()) return h("div",{class:"box"},h("h2",{style:"font-size:1.1rem"},"Adding a teammate"),
    h("p",{style:"margin:8px 0 0"},"Ask an admin to add the person's Google email. Once added, they sign in with Google, pick their school, and appear here."));
  const f=h("form",{class:"stack",style:"gap:10px",onsubmit:async e=>{
    e.preventDefault(); const em=document.getElementById("acc_email").value.trim().toLowerCase(), adm=document.getElementById("acc_admin").checked, role=document.getElementById("acc_role").value;
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast("Enter a valid email address"); return; }
    if(await write(db=>db.doc("members/"+em).set({admin:adm,role,addedBy:S.myId||null,addedAt:new Date().toISOString()}),`${em} can now sign in`)){ document.getElementById("acc_email").value=""; document.getElementById("acc_admin").checked=false; clearDirty(f); }
  }},
    h("label",{class:"f"},"Google email",h("input",{id:"acc_email",type:"email",autocomplete:"off",placeholder:"name@gmail.com"})),
    h("label",{class:"f"},"Their role",h("select",{id:"acc_role"},TEAM_ROLES.map(r=>h("option",{value:r,selected:r==="Speaker"?"selected":null},r)))),
    h("label",{class:"row",style:"gap:10px;font-weight:400"},h("input",{id:"acc_admin",type:"checkbox"}),"Admin (can add and remove people from this list)"),
    h("button",{class:"btn primary",type:"submit",style:"align-self:flex-start"},"Give access"));
  const list=S.members.slice().sort((a,b)=>a.id.localeCompare(b.id));
  return h("div",{class:"box stack"},
    h("div",null,h("h2",{style:"font-size:1.1rem"},"Who can sign in"),h("p",{class:"muted small",style:"margin:4px 0 0"},"Only these Google accounts can open the database. Add someone here, then send them the link. They choose their school when they first sign in.")),
    f,
    list.length?h("div",{class:"list"},list.map(m=>h("div",{class:"res",style:"cursor:default"},
      h("span",{style:"min-width:0"},h("span",{class:"name",style:"display:block"},m.id),h("span",{class:"meta"},[m.role||"No role yet",m.admin?"Admin":null].filter(Boolean).join(" · "))),
      m.id===FB.email?h("span",{class:"meta"},"you"):(S.confirm==="acc:"+m.id
        ?h("span",{class:"row",style:"gap:6px;flex-wrap:nowrap"},h("button",{class:"btn small danger",onclick:async()=>{ if(await write(db=>db.doc("members/"+m.id).delete(),"Access removed")){ S.confirm=null; render(); } }},"Remove"),h("button",{class:"btn small",onclick:()=>{S.confirm=null; render();}},"Keep"))
        :h("button",{class:"link small",style:"color:var(--muted)",onclick:()=>{S.confirm="acc:"+m.id; render();}},"Remove access"))))):null);
}

// ---------- boot ----------
let started=false;
window.startApp=()=>{ if(started) return; started=true;
  if(window.FB&&window.FB.guest) Object.assign(S,{guest:true,guestLocked:true,canWrite:false,realCanWrite:false});
  render(); init(); };
})();
</script>
<script type="module" src="./app-firebase.js?v=15"></script>
</body>
</html>
